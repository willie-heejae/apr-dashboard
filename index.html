const groupOrder={'전1':0,'전2':1,'전3':2,'일1':3,'일2':4,'일3':5,'-':6};
let currentPeriod='tt'; // tt=전체, wd=주중, fr=금, sa=토
let currentSigFilter='all';

function getKeys(period){
  const p=period;
  return {
    a25: p==='tt'?'aT25':p==='wd'?'aW25':p==='fr'?'aF25':'aS25',
    a26: p==='tt'?'aT26':p==='wd'?'aW26':p==='fr'?'aF26':'aS26',
    o25: p==='tt'?'oT25':p==='wd'?'oW25':p==='fr'?'oF25':'oS25',
    o26: p==='tt'?'oT26':p==='wd'?'oW26':p==='fr'?'oF26':'oS26',
  };
}

function calcSig(a25,a26,o25,o26){
  let adrSig='gray',occSig='gray',adrPct=null,occDiff=null;
  // ADR: 작년대비 -5%이하=양호, -5%~+5%=보통, +5%초과=주의
  if(a25!=null&&a26!=null&&a25>0){
    adrPct=((a26-a25)/a25)*100;
    adrSig=adrPct<=-5?'green':adrPct<=5?'yellow':'red';
  }
  // OCC: +5%p이상=양호, ±5%p=보통, -5%p초과하락=주의
  if(o25!=null&&o26!=null){
    occDiff=o26-o25;
    occSig=occDiff>=5?'green':occDiff>=-5?'yellow':'red';
  }
  // 종합: 기본 ADR 따라감. 단 ADR이 보통/주의여도 OCC가 양호면 → 양호
  let overall=adrSig;
  if(adrSig==='yellow'||adrSig==='red'){
    overall=occSig==='green'?'green':adrSig;
  }
  if(adrSig==='gray') overall=occSig==='gray'?'gray':occSig;
  return{adrSig,occSig,overall,adrPct,occDiff};
}

// Populate filters
const managers=[...new Set(RAW.map(r=>r.m))].filter(Boolean).sort();
const mgrSel=document.getElementById('mgrFilter');
managers.forEach(m=>{const o=document.createElement('option');o.value=m;o.textContent=m;mgrSel.appendChild(o);});
const groups=[...new Set(RAW.map(r=>r.g))].filter(Boolean).sort((a,b)=>(groupOrder[a]??99)-(groupOrder[b]??99));
const grpSel=document.getElementById('grpFilter');
groups.forEach(g=>{const o=document.createElement('option');o.value=g;o.textContent=g;grpSel.appendChild(o);});

function render(){
  const q=document.getElementById('search').value.toLowerCase();
  const mgr=mgrSel.value, grp=grpSel.value, sort=document.getElementById('sortBy').value;
  const k=getKeys(currentPeriod);

  // Compute signals for current period
  let list=RAW.map(r=>{
    const sig=calcSig(r[k.a25],r[k.a26],r[k.o25],r[k.o26]);
    return Object.assign({},r,sig,{_a25:r[k.a25],_a26:r[k.a26],_o25:r[k.o25],_o26:r[k.o26]});
  });

  // Filter
  list=list.filter(r=>{
    if(q&&!r.n.toLowerCase().includes(q)&&!r.c.includes(q))return false;
    if(currentSigFilter!=='all'&&r.overall!==currentSigFilter)return false;
    if(mgr!=='all'&&r.m!==mgr)return false;
    if(grp!=='all'&&r.g!==grp)return false;
    return true;
  });

  // Sort
  list.sort((a,b)=>{
    if(sort==='group')return(groupOrder[a.g]??99)-(groupOrder[b.g]??99)||a.n.localeCompare(b.n,'ko');
    if(sort==='name')return a.n.localeCompare(b.n,'ko');
    if(sort==='adr_chg')return(b.adrPct??-999)-(a.adrPct??-999);
    if(sort==='occ_chg')return(b.occDiff??-999)-(a.occDiff??-999);
    if(sort==='signal'){const o={red:0,yellow:1,gray:2,green:3};return(o[a.overall]??2)-(o[b.overall]??2);}
    return 0;
  });

  // Summary
  let gC=0,yC=0,rC=0;
  list.forEach(r=>{if(r.overall==='green')gC++;else if(r.overall==='yellow')yC++;else if(r.overall==='red')rC++;});
  document.getElementById('summary').innerHTML=
    '<div class="box total-box"><span>전체</span>'+list.length+'</div>'+
    '<div class="box green-box"><span>🟢 양호</span>'+gC+'</div>'+
    '<div class="box yellow-box"><span>🟡 보통</span>'+yC+'</div>'+
    '<div class="box red-box"><span>🔴 주의</span>'+rC+'</div>'+
    '<div class="box" style="background:#e9ecef"><span>⚪ 데이터없음</span>'+(list.length-gC-yC-rC)+'</div>';

  // Table
  const tbody=document.getElementById('tbody');
  let h='';
  list.forEach((r,i)=>{
    const adrFmt=r.adrPct!=null?(r.adrPct>0?'+':'')+r.adrPct.toFixed(1)+'%':'-';
    const adrCls=r.adrPct!=null?(r.adrPct>=5?'pct-up':r.adrPct<=-5?'pct-down':'pct-flat'):'no-data';
    const occFmt=r.occDiff!=null?(r.occDiff>0?'+':'')+r.occDiff.toFixed(1)+'%p':'-';
    const occCls=r.occDiff!=null?(r.occDiff>=5?'pct-up':r.occDiff<=-5?'pct-down':'pct-flat'):'no-data';
    h+='<tr>'+
      '<td>'+(i+1)+'</td>'+
      '<td>'+r.c+'</td>'+
      '<td class="name-cell" title="'+r.n+'">'+r.n+'</td>'+
      '<td>'+r.m+'</td>'+
      '<td><span class="group-badge g-'+r.g+'">'+r.g+'</span></td>'+
      '<td>'+(r._a25!=null?Math.round(r._a25).toLocaleString():'-')+'</td>'+
      '<td>'+(r._a26!=null?Math.round(r._a26).toLocaleString():'-')+'</td>'+
      '<td class="'+adrCls+'">'+adrFmt+'</td>'+
      '<td><span class="signal sig-'+r.adrSig+'"></span></td>'+
      '<td>'+(r._o25!=null?r._o25.toFixed(1)+'%':'-')+'</td>'+
      '<td>'+(r._o26!=null?r._o26.toFixed(1)+'%':'-')+'</td>'+
      '<td class="'+occCls+'">'+occFmt+'</td>'+
      '<td><span class="signal sig-'+r.occSig+'"></span></td>'+
      '<td><span class="signal sig-'+r.overall+'"></span></td>'+
      '</tr>';
  });
  tbody.innerHTML=h;
  window._curList=list;
}

// Gemini AI Chat
function getGeminiKey(){return localStorage.getItem("gemini_api_key")||"";}function setGeminiKey(){const cur=localStorage.getItem("gemini_api_key")||"";const k=prompt("Gemini API 키를 입력하세요 (AIzaSy...로 시작).\n\nhttps://aistudio.google.com/apikey 에서 발급.\n이 키는 이 브라우저에만 저장되며 GitHub에 올라가지 않습니다.",cur);if(k&&k.trim()){localStorage.setItem("gemini_api_key",k.trim());alert("저장됨. 이제 질문할 수 있어요.");}}
let aiHistory=[];
function buildDataContext(){
  const list=window._curList||[];
  const periodLabel={tt:'전체',wd:'주중',fr:'금요일',sa:'토요일'}[currentPeriod]||currentPeriod;
  let g=0,y=0,rc=0,gr=0;
  list.forEach(x=>{if(x.overall==='green')g++;else if(x.overall==='yellow')y++;else if(x.overall==='red')rc++;else gr++;});
  const rows=list.map(x=>`${x.c}|${x.n}|${x.m}|${x.g}|ADR25:${x._a25??'-'}|ADR26:${x._a26??'-'}|ADRpct:${x.adrPct!=null?x.adrPct.toFixed(1)+'%':'-'}|OCC25:${x._o25!=null?x._o25.toFixed(1)+'%':'-'}|OCC26:${x._o26!=null?x._o26.toFixed(1)+'%':'-'}|OCCdiff:${x.occDiff!=null?x.occDiff.toFixed(1)+'%p':'-'}|신호:${x.overall}`).join('\n');
  return `[데이터 컨텍스트 — 25년 4월 vs 26년 4월 ${periodLabel}]
- 총 ${list.length}개 숙소 (현재 필터 기준)
- 신호 분포: 🟢양호 ${g}, 🟡보통 ${y}, 🔴주의 ${rc}, ⚪데이터없음 ${gr}
- 신호등 기준: ADR 변동률 ≤-5% 양호, -5~+5% 보통, >+5% 주의 / OCC 변동 ±5%p

[숙소별 상세]
코드|숙소명|CX담당자|그룹|ADR데이터
${rows}

반드시 한국어로만 답변하세요. 영어 사용 금지. 위 데이터를 바탕으로 사용자의 질문에 간결하고 정확하게 한국어로 답변해주세요. 숙소명과 수치를 구체적으로 인용하고, 데이터에 없는 내용은 추측하지 마세요.`;
}
function appendMsg(role,text,cls){
  const chat=document.getElementById('aiChat');
  chat.classList.add('show');
  const div=document.createElement('div');
  div.className='ai-msg '+role+(cls?' '+cls:'');
  div.innerHTML='<span class="role">'+(role==='user'?'나':'Gemini')+'</span><div class="text"></div>';
  div.querySelector('.text').textContent=text;
  chat.appendChild(div);
  chat.scrollTop=chat.scrollHeight;
  return div;
}
function resetAIChat(){
  aiHistory=[];
  const chat=document.getElementById('aiChat');
  chat.innerHTML='';
  chat.classList.remove('show');
}
async function sendAIChat(){if(!getGeminiKey()){setGeminiKey();if(!getGeminiKey())return;}
  const input=document.getElementById('aiInput');
  const btn=document.getElementById('aiSendBtn');
  const q=input.value.trim();
  if(!q)return;
  input.value='';
  btn.disabled=true;btn.textContent='전송 중...';
  appendMsg('user',q);
  const loadingDiv=appendMsg('bot','생각 중...','loading');
  // On first message, prepend data context
  const parts=[];
  if(aiHistory.length===0){
    parts.push({text:buildDataContext()+'\n\n사용자 질문: '+q});
  }else{
    // Include history
    aiHistory.forEach(m=>parts.push({text:(m.role==='user'?'사용자: ':'assistant: ')+m.text}));
    parts.push({text:'사용자: '+q});
  }
  const contents=aiHistory.length===0
    ? [{role:'user',parts:[{text:buildDataContext()+'\n\n질문: '+q}]}]
    : [{role:'user',parts:[{text:buildDataContext()}]},
       ...aiHistory.map(m=>({role:m.role==='user'?'user':'model',parts:[{text:m.text}]})),
       {role:'user',parts:[{text:q}]}];
  try{let data=null;for(let attempt=1;attempt<=4;attempt++){loadingDiv.querySelector('.text').textContent=attempt===1?'생각 중...':'재시도 중... ('+attempt+'/4)';try{const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${getGeminiKey()}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents,generationConfig:{temperature:0.4,maxOutputTokens:4096,thinkingConfig:{thinkingBudget:0}}})});data=await res.json();const msg=data.error?.message||'';const transient=res.status===503||res.status===429||/high demand|overloaded|UNAVAILABLE|try again/i.test(msg);if(data.error&&transient&&attempt<4){await new Promise(r=>setTimeout(r,1500*attempt));continue;}break;}catch(ne){if(attempt<4){await new Promise(r=>setTimeout(r,1500*attempt));continue;}throw ne;}}loadingDiv.classList.remove('loading');if(data&&data.error){loadingDiv.querySelector('.text').textContent='❌ 오류: '+data.error.message;}else if(data){const text=data.candidates?.[0]?.content?.parts?.[0]?.text||'응답이 비어있습니다.';loadingDiv.querySelector('.text').textContent=text;aiHistory.push({role:'user',text:q});aiHistory.push({role:'bot',text});}}catch(e){loadingDiv.classList.remove('loading');loadingDiv.querySelector('.text').textContent='❌ 네트워크 오류: '+e.message;}finally{
    btn.disabled=false;btn.textContent='전송';
    input.focus();
  }
}

// Events
document.getElementById('search').addEventListener('input',render);
mgrSel.addEventListener('change',render);
grpSel.addEventListener('change',render);
document.getElementById('sortBy').addEventListener('change',render);
document.querySelectorAll('#sigFilter button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('#sigFilter button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentSigFilter=btn.dataset.v;
    render();
  });
});
document.querySelectorAll('#periodTabs button').forEach(btn=>{
  btn.addEventListener('click',()=>{
    document.querySelectorAll('#periodTabs button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    currentPeriod=btn.dataset.p;
    render();
  });
});
render();
